<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CSS Pro Lab</title>
<style>
:root{
  --bg:#0a0a0f;
  --card:#15151f;
  --card2:#1f1f2e;
  --accent:#00d4ff;
  --accent2:#7c3aed;
  --text:#e4e4e7;
  --text-dim:#71717a;
  --error:#ef4444;
  --warn:#f59e0b;
  --success:#22c55e;
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,Arial,sans-serif;
  overflow-x:hidden;
}

body::before{
  content:'';
  position:fixed;
  inset:0;
  background:radial-gradient(circle at 20% 50%, rgba(124,58,237,0.15) 0%, transparent 50%),
             radial-gradient(circle at 80% 50%, rgba(0,212,255,0.15) 0%, transparent 50%);
  z-index:-1;
}

nav{
  position:sticky;
  top:0;
  background:rgba(10,10,15,0.7);
  backdrop-filter:blur(20px);
  padding:15px 5%;
  border-bottom:1px solid rgba(255,255,255,0.08);
  z-index:100;
  display:flex;
  gap:12px;
}

nav button{
  background:transparent;
  border:1px solid rgba(255,255,255,0.1);
  color:var(--text-dim);
  padding:10px 20px;
  border-radius:10px;
  cursor:pointer;
  transition:0.3s;
  font-weight:600;
}

nav button:hover{
  border-color:var(--accent);
  color:var(--accent);
  transform:translateY(-2px);
}

.container{
  padding:80px 5%;
  max-width:1400px;
  margin:0 auto;
}

h1{
  font-size:52px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:15px;
}

.sub{
  color:var(--text-dim);
  font-size:18px;
  margin-bottom:30px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-top:30px;
}

.editor,.preview{
  background:var(--card);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  box-shadow:0 10px 40px rgba(0,0,0,0.3);
}

.editor-header{
  background:rgba(0,0,0,0.3);
  padding:14px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid rgba(255,255,255,0.08);
}

textarea{
  flex:1;
  background:#0d0d14;
  color:var(--text);
  border:none;
  padding:20px;
  font-family:'Courier New',monospace;
  font-size:14px;
  resize:none;
  outline:none;
}

iframe{
  flex:1;
  border:none;
  background:#fff;
  min-height:400px;
}

.console{
  background:#0d0d14;
  padding:15px;
  font-family:'Courier New',monospace;
  font-size:13px;
  max-height:180px;
  overflow:auto;
  border-top:1px solid rgba(255,255,255,0.08);
}

.console.log{margin:5px 0}
.console.err{color:var(--error)}
.console.warn{color:var(--warn)}
.console.ok{color:var(--success)}

.btn{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border:none;
  padding:10px 25px;
  border-radius:8px;
  color:white;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
}

.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(124,58,237,0.4)}

.presets{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

.preset{
  background:var(--card2);
  border:1px solid rgba(255,255,255,0.08);
  padding:10px 18px;
  border-radius:10px;
  cursor:pointer;
  font-size:14px;
  transition:0.3s;
  white-space:nowrap;
}

.preset:hover{
  border-color:var(--accent);
  background:rgba(0,212,255,0.1);
  transform:translateY(-2px);
}

.showcase{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:25px;
  margin-top:40px;
}

.demo-box{
  height:160px;
  background:var(--card2);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:18px;
  cursor:pointer;
  transition:0.3s;
  position:relative;
  overflow:hidden;
}

.demo-box:hover{
  transform:translateY(-8px);
  border-color:var(--accent);
  box-shadow:0 15px 30px rgba(0,212,255,0.2);
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  backdrop-filter:blur(10px);
  z-index:200;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal.active{display:flex}

.modal-content{
  background:var(--card);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:16px;
  width:100%;
  max-width:700px;
  max-height:80vh;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}

.modal-header{
  padding:20px;
  border-bottom:1px solid rgba(255,255,255,0.08);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.modal-header h3{color:var(--accent)}

.modal-body{
  padding:20px;
  overflow:auto;
}

.code-block{
  background:#0d0d14;
  padding:20px;
  border-radius:10px;
  font-family:'Courier New',monospace;
  font-size:14px;
  overflow-x:auto;
  white-space:pre;
  border:1px solid rgba(255,255,255,0.08);
}

.modal-actions{
  padding:20px;
  border-top:1px solid rgba(255,255,255,0.08);
  display:flex;
  gap:10px;
}

.close-btn{
  background:transparent;
  border:1px solid rgba(255,255,255,0.2);
  color:var(--text);
  padding:10px 20px;
  border-radius:8px;
  cursor:pointer;
}

@media(max-width:900px){
.grid{grid-template-columns:1fr}
 h1{font-size:36px}
</style>
</head>
<body>

<nav>
  <button onclick="scrollTo('lab')">Lab</button>
  <button onclick="scrollTo('animations')">Animations</button>
</nav>

<div class="container" id="lab">
  <h1>CSS Pro Lab</h1>
  <p class="sub">25 advanced CSS animations. Click a preset, hit Run, see it live.</p>

  <div class="presets" id="presetList">
    <!-- Presets injected by JS -->
  </div>

  <div class="grid">
    <div class="editor">
      <div class="editor-header">
        <span>CSS Editor</span>
        <button class="btn" onclick="runCSS()">Run</button>
      </div>
      <textarea id="cssInput">.card {
  width: 200px;
  height: 200px;
  background: linear-gradient(135deg, #7c3aed, #00d4ff);
  border-radius: 20px;
  animation: float 3s ease-in-out infinite;
  box-shadow: 0 0 40px rgba(124,58,237,0.5);
}

@keyframes float {
 0%, 100% { transform: translateY(0) rotate(0deg); }
 50% { transform: translateY(-30px) rotate(5deg); }
}</textarea>
    </div>

    <div class="preview">
      <iframe id="preview"></iframe>
      <div class="console" id="console">
        <div class="log ok">Console ready. Write CSS and hit Run.</div>
      </div>
    </div>
  </div>
</div>

<div class="container" id="animations">
  <h1>Animation Showcase</h1>
  <p class="sub">Click any animation to view and copy the code</p>

  <div class="showcase">
    <div class="demo-box" style="animation:pulse 2s infinite" onclick="showCode('pulse')">Pulse</div>
    <div class="demo-box" style="animation:shake 0.5s infinite" onclick="showCode('shake')">Shake</div>
    <div class="demo-box" style="animation:glow 2s ease-in-out infinite" onclick="showCode('glow')">Glow</div>
    <div class="demo-box" style="animation:flip 2s linear infinite" onclick="showCode('flip')">Flip</div>
  </div>
</div>

<div class="modal" id="codeModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">CSS Code</h3>
      <button class="close-btn" onclick="closeModal()">Close</button>
    </div>
    <div class="modal-body">
      <div class="code-block" id="modalCode"></div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="copyCode()">Copy Code</button>
      <button class="btn" onclick="useCode()">Use in Lab</button>
    </div>
  </div>
</div>

<style id="showcase-animations">
@keyframes pulse{
 0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(0,212,255,0.7)}
 50%{transform:scale(1.05);box-shadow:0 0 30px 10px rgba(0,212,255,0)}
}
@keyframes shake{
 0%,100%{transform:translateX(0)}
 25%{transform:translateX(-10px)}
 75%{transform:translateX(10px)}
}
@keyframes glow{
 0%,100%{box-shadow:0 0 20px #7c3aed}
 50%{box-shadow:0 0 50px #00d4ff}
}
@keyframes flip{
 0%{transform:rotateY(0)}
 50%{transform:rotateY(180deg)}
 100%{transform:rotateY(360deg)}
}
</style>

<script>
const presets={
  glow:`.glow {
  width: 200px; height: 200px; background: #15151f; border-radius: 20px; position: relative;
}
.glow::before {
  content: ''; position: absolute; inset: -3px; 
  background: linear-gradient(45deg, #00d4ff, #7c3aed, #00d4ff);
  border-radius: 20px; z-index: -1; animation: rotate 3s linear infinite;
  background-size: 200% 200%;
}
@keyframes rotate {
 0% { background-position: 0% 50%; }
 100% { background-position: 200% 50%; }
}`,

  '3d':`.flip { width: 200px; height: 200px; perspective: 1000px; }
.flip-inner {
  width: 100%; height: 100%; transform-style: preserve-3d; animation: flip 3s infinite;
}
@keyframes flip { 0%,100% { transform: rotateY(0); } 50% { transform: rotateY(180deg); } }
.front,.back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; 
  display: flex; align-items: center; justify-content: center; border-radius: 20px; }
.front { background: #7c3aed; } .back { background: #00d4ff; transform: rotateY(180deg); }`,

  bounce:`.balls { display: flex; gap: 20px; }
.ball { width: 50px; height: 50px; border-radius: 50%; 
  background: linear-gradient(135deg, #7c3aed, #00d4ff); animation: bounce 1s ease-in-out infinite; }
.ball:nth-child(2){animation-delay:0.2s} .ball:nth-child(3){animation-delay:0.4s}
@keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-80px); }`,

  wave:`.wave { font-size: 48px; font-weight: 800; display: flex; }
.wave span { display: inline-block; animation: wave 1.5s ease-in-out infinite; }
.wave span:nth-child(1){animation-delay:0.1s} .wave span:nth-child(2){animation-delay:0.2s}
.wave span:nth-child(3){animation-delay:0.3s}
@keyframes wave { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }`,

  morph:`.blob { width: 200px; height: 200px; 
  background: linear-gradient(135deg, #7c3aed, #00d4ff);
  border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
  animation: morph 8s ease-in-out infinite; }
@keyframes morph {
 0%,100%{border-radius:60% 40% 30% 70% / 60% 30% 70% 40%}
 50%{border-radius:30% 60% 70% 40% / 50% 60% 30% 60%}
}`,

  spin:`.spinner { width: 80px; height: 80px; border: 6px solid #15151f;
  border-top: 6px solid #00d4ff; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); }`,

  pulse2:`.pulse {
  width: 150px; height: 150px; background: #7c3aed; border-radius: 50%;
  animation: pulse2 2s infinite;
}
@keyframes pulse2 {
 0% { box-shadow: 0 0 0 0 rgba(124,58,237,0.7); }
 70% { box-shadow: 0 0 0 40px rgba(124,58,237,0); }
 100% { box-shadow: 0 0 0 0 rgba(124,58,237,0); }
}`,

  slide:`.slider { width: 200px; height: 100px; background: #00d4ff; border-radius: 12px;
  animation: slide 3s ease-in-out infinite; }
@keyframes slide {
 0%,100% { transform: translateX(-50px); }
 50% { transform: translateX(50px); }
}`,

  fade:`.fader { width: 200px; height: 100px; background: #7c3aed; border-radius: 12px;
  animation: fade 2s ease-in-out infinite; }
@keyframes fade {
 0%,100% { opacity: 1; } 50% { opacity: 0.2; }
}`,

  tilt:`.tilt { width: 200px; height: 150px; background: linear-gradient(135deg,#00d4ff,#7c3aed);
  border-radius: 15px; animation: tilt 4s ease-in-out infinite; }
@keyframes tilt {
 0%,100% { transform: perspective(1000px) rotateY(0deg); }
 50% { transform: perspective(1000px) rotateY(25deg); }
}`,

  swing:`.swing { width: 100px; height: 150px; background: #7c3aed; border-radius: 10px;
  transform-origin: top center; animation: swing 2s ease-in-out infinite; }
@keyframes swing {
 0%,100% { transform: rotate(0deg); }
 25% { transform: rotate(15deg); }
 75% { transform: rotate(-15deg); }
}`,

  wobble:`.wobble { width: 180px; height: 100px; background: #00d4ff; border-radius: 15px;
  animation: wobble 1s ease-in-out infinite; }
@keyframes wobble {
 0%,100% { transform: translateX(0%); }
 15% { transform: translateX(-25%) rotate(-5deg); }
 30% { transform: translateX(20%) rotate(3deg); }
 45% { transform: translateX(-15%) rotate(-3deg); }
 60% { transform: translateX(10%) rotate(2deg); }
}`,

  heartbeat:`.heart { width: 100px; height: 90px; background: #ef4444; position: relative;
  transform: rotate(-45deg); animation: heartbeat 1s infinite; }
.heart::before,.heart::after { content: ''; width: 100px; height: 90px; 
  position: absolute; background: #ef4444; border-radius: 50%; }
.heart::before { top: -50px; left: 0; } .heart::after { left: 50px; top: 0; }
@keyframes heartbeat {
 0%,100% { transform: rotate(-45deg) scale(1); }
 50% { transform: rotate(-45deg) scale(1.2); }
}`,

  rainbow:`.rainbow { width: 250px; height: 80px; border-radius: 15px;
  background: linear-gradient(90deg, red, orange, yellow, green, blue, indigo, violet);
  background-size: 400% 100%; animation: rainbow 3s linear infinite; }
@keyframes rainbow { 0%{background-position:0% 50%} 100%{background-position:400% 50%} }`,

  typing:`.typing { font-size: 28px; font-family: monospace; border-right: 3px solid #00d4ff;
  white-space: nowrap; overflow: hidden; width: 0; animation: typing 3s steps(20) infinite; }
@keyframes typing { 0%{width:0} 50%{width:200px} 100%{width:0} }`,

  neon:`.neon { font-size: 48px; font-weight: 800; color: #00d4ff;
  text-shadow: 0 0 10px #00d4ff, 0 0 20px #00d4ff, 0 0 40px #00d4ff;
  animation: neon 1.5s ease-in-out infinite alternate; }
@keyframes neon {
 from { text-shadow: 0 0 10px #00d4ff, 0 0 20px #00d4ff; }
 to { text-shadow: 0 0 20px #00d4ff, 0 0 40px #00d4ff, 0 0 60px #00d4ff; }
}`,

  blur:`.blur { width: 200px; height: 100px; background: #7c3aed; border-radius: 15px;
  animation: blur 3s ease-in-out infinite; }
@keyframes blur {
 0%,100% { filter: blur(0px); } 50% { filter: blur(8px); }
}`,

  rotate3d:`.rotate3d { width: 150px; height: 150px; background: linear-gradient(135deg,#7c3aed,#00d4ff);
  animation: rotate3d 4s linear infinite; }
@keyframes rotate3d {
 0% { transform: rotateX(0) rotateY(0); }
 100% { transform: rotateX(360deg) rotateY(360deg); }
}`,

  rubber:`.rubber { width: 180px; height: 80px; background: #00d4ff; border-radius: 10px;
  animation: rubber 1s ease-in-out infinite; }
@keyframes rubber {
 0%,100% { transform: scaleX(1); }
 30% { transform: scaleX(1.25) scaleY(0.75); }
 40% { transform: scaleX(0.75) scaleY(1.25); }
}`,

  float2:`.float2 { width: 120px; height: 120px; background: #7c3aed; border-radius: 50%;
  animation: float2 3s ease-in-out infinite; }
@keyframes float2 {
 0%,100% { transform: translateY(0px); }
 50% { transform: translateY(-25px); }
}`,

  skew:`.skew { width: 200px; height: 100px; background: #00d4ff; border-radius: 10px;
  animation: skew 2s ease-in-out infinite; }
@keyframes skew {
 0%,100% { transform: skewX(0deg); }
 50% { transform: skewX(20deg); }
}`,

  zoom:`.zoom { width: 150px; height: 150px; background: #7c3aed; border-radius: 20px;
  animation: zoom 2s ease-in-out infinite; }
@keyframes zoom {
 0%,100% { transform: scale(1); }
 50% { transform: scale(1.3); }
}`,

  shake2:`.shake2 { width: 180px; height: 80px; background: #ef4444; border-radius: 10px;
  animation: shake2 0.5s infinite; }
@keyframes shake2 {
 0%,100% { transform: translate(0,0) rotate(0); }
 25% { transform: translate(5px,5px) rotate(5deg); }
 75% { transform: translate(-5px,-5px) rotate(-5deg); }
}`
};

const animCodes={
  pulse:`/* Pulse Animation */
.box { animation: pulse 2s infinite; }
@keyframes pulse{
 0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(0,212,255,0.7)}
 50%{transform:scale(1.05);box-shadow:0 0 30px 10px rgba(0,212,255,0)}
}`,
  shake:`/* Shake Animation */
.box { animation: shake 0.5s infinite; }
@keyframes shake{
 0%,100%{transform:translateX(0)}
 25%{transform:translateX(-10px)}
 75%{transform:translateX(10px)}
}`,
  glow:`/* Glow Animation */
.box { animation: glow 2s ease-in-out infinite; }
@keyframes glow{
 0%,100%{box-shadow:0 0 20px #7c3aed}
 50%{box-shadow:0 0 50px #00d4ff}
}`,
  flip:`/* 3D Flip Animation */
.box { animation: flip 2s linear infinite; transform-style: preserve-3d; }
@keyframes flip{
 0%{transform:rotateY(0)}
 50%{transform:rotateY(180deg)}
 100%{transform:rotateY(360deg)}
}`
};

let currentCode='';

function initPresets(){
  const list=document.getElementById('presetList');
  Object.keys(presets).forEach(key=>{
    const btn=document.createElement('div');
    btn.className='preset';
    btn.textContent=key.charAt(0).toUpperCase()+key.slice(1).replace(/([A-Z])/g,' $1');
    btn.onclick=()=>loadPreset(key);
    list.appendChild(btn);
  });
}

function scrollTo(id){
  document.getElementById(id).scrollIntoView({behavior:'smooth'});
}

function loadPreset(name){
  document.getElementById('cssInput').value=presets[name];
  runCSS();
  scrollTo('lab');
}

function showCode(name){
  currentCode=animCodes[name];
  document.getElementById('modalTitle').textContent=name.charAt(0).toUpperCase()+name.slice(1)+' Animation';
  document.getElementById('modalCode').textContent=currentCode;
  document.getElementById('codeModal').classList.add('active');
}

function closeModal(){
  document.getElementById('codeModal').classList.remove('active');
}

function copyCode(){
  navigator.clipboard.writeText(currentCode);
  alert('Code copied!');
}

function useCode(){
  document.getElementById('cssInput').value=currentCode;
  closeModal();
  runCSS();
  scrollTo('lab');
}

function logConsole(type,message){
  const console=document.getElementById('console');
  const div=document.createElement('div');
  div.className='log '+type;
  div.textContent=message;
  console.appendChild(div);
  console.scrollTop=console.scrollHeight;
}

function detectHTML(css){
  if(css.includes('.glow')) return '<div class="glow"></div>';
  if(css.includes('.flip')) return '<div class="flip"><div class="flip-inner"><div class="front">Front</div><div class="back">Back</div></div></div>';
  if(css.includes('.balls')) return '<div class="balls"><div class="ball"></div><div class="ball"></div><div class="ball"></div></div>';
  if(css.includes('.wave')) return '<div class="wave"><span>C</span><span>S</span><span>S</span></div>';
  if(css.includes('.blob')) return '<div class="blob"></div>';
  if(css.includes('.spinner')) return '<div class="spinner"></div>';
  if(css.includes('.pulse')) return '<div class="pulse"></div>';
  if(css.includes('.slider')) return '<div class="slider"></div>';
  if(css.includes('.fader')) return '<div class="fader"></div>';
  if(css.includes('.tilt')) return '<div class="tilt"></div>';
  if(css.includes('.swing')) return '<div class="swing"></div>';
  if(css.includes('.wobble')) return '<div class="wobble"></div>';
  if(css.includes('.heart')) return '<div class="heart"></div>';
  if(css.includes('.rainbow')) return '<div class="rainbow"></div>';
  if(css.includes('.typing')) return '<div class="typing">CSS Animation</div>';
  if(css.includes('.neon')) return '<div class="neon">NEON</div>';
  if(css.includes('.blur')) return '<div class="blur"></div>';
  if(css.includes('.rotate3d')) return '<div class="rotate3d"></div>';
  if(css.includes('.rubber')) return '<div class="rubber"></div>';
  if(css.includes('.float2')) return '<div class="float2"></div>';
  if(css.includes('.skew')) return '<div class="skew"></div>';
  if(css.includes('.zoom')) return '<div class="zoom"></div>';
  if(css.includes('.shake2')) return '<div class="shake2"></div>';
  return '<div class="card"></div>';
}

function runCSS(){
  const css=document.getElementById('cssInput').value;
  const iframe=document.getElementById('preview');
  const console=document.getElementById('console');

  console.innerHTML='';
  logConsole('log','Running CSS...');

  const htmlContent=detectHTML(css);

  const html=`
    <!DOCTYPE html>
    <html>
    <head>
      <style>
        body{
          margin:0;
          display:flex;
          justify-content:center;
          align-items:center;
          height:100vh;
          background:#fff;
        }
        ${css}
      </style>
    </head>
    <body>
      ${htmlContent}
    </body>
    </html>
  `;

  iframe.srcdoc=html;

  try{
    const style=new CSSStyleSheet();
    style.replaceSync(css);
    logConsole('ok','✓ CSS is valid. No syntax errors.');
  }catch(e){
    logConsole('err','✗ Syntax Error: '+e.message);
  }

  if((css.match(/{/g)||[]).length!== (css.match(/}/g)||[]).length){
    logConsole('err','✗ Error: Unmatched curly braces.');
  }
}

window.onclick=function(e){
  if(e.target.id==='codeModal'){
    closeModal();
  }
}

window.onload=function(){
  initPresets();
  runCSS();
};
</script>
